# ========================================
# 论文查重管理系统 - 生产环境编排（仅应用容器）
#
# 中间件（mysql / redis / minio / kkfileview）不在这里定义：
# 它们由服务器上的 /opt/check-repeat/docker-compose.yml 管理并已在运行，
# 本项目通过外部网络与既有数据卷接入。
#
# 项目名必须显式隔离：/opt/check-repeat 那份 compose 的项目名是 check-repeat，
# 两边同名时会被视为同一个项目，任一侧执行 docker compose down
# 都会连带删除对方的容器。
#
# 用法:
#   docker compose -f docker-compose.prod.yml up -d backend
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f backend
#
# 前置条件: 同目录存在 .env（含全部密钥、MYSQL_DATABASE 与 BACKEND_IMAGE）
# ========================================

name: check-repeat-backend

services:
  # ========== Spring Boot 后端 ==========
  # 镜像由 Jenkins 在本机构建并打上 BUILD_NUMBER tag，
  # BACKEND_IMAGE 由 deploy.sh 写入 .env
  backend:
    image: ${BACKEND_IMAGE:-check-repeat-service:latest}
    container_name: check-backend
    restart: unless-stopped
    environment:
      # 服务
      SERVER_PORT: 8080
      # 数据库
      # 库名走 MYSQL_DATABASE：生产指向既有的 check-repeat-system。
      # 注意 MYSQL_URL_PARAMS 等旧变量代码里并未读取，不要依赖。
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-check-repeat-service}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO
      # MINIO_ENDPOINT 是容器内的连接地址（网络别名），后端 SDK 用
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      # MINIO_PUBLIC_ENDPOINT 是拼给浏览器的地址（头像 <img src>、论文正文路径），
      # 必须在 .env 里显式配成浏览器可达的地址。当前线上走网关反代，
      # 配 MINIO_PUBLIC_ENDPOINT=https://check-repeat-system.xyz/minio
      # （对应 deploy/nginx-gateway.conf 里的 location /minio/，二者前缀必须一致）。
      # 不配的话头像 URL 会是 http://minio:9000/... —— 浏览器解析不了，头像裂图。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio:9000}
      MINIO_ACCESSKEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRETKEY: ${MINIO_ROOT_PASSWORD}
      # KKFileView 在线预览（缺失时 yml 会回退到 http://localhost:8080，即后端自身，预览必然 404）
      KKFILEVIEW_BASE_URL: ${KKFILEVIEW_BASE_URL:-http://kkfileview:8012}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 报告验真哈希盐（上线后不可更换）。
      # 注意：.env 只用于本文件的 ${...} 替换，不会自动透传进容器，必须在此显式映射，
      # 否则容器内读不到，ProductionSecretValidator 会以「REPORT_HASH_SALT 未配置」拒绝启动。
      REPORT_HASH_SALT: ${REPORT_HASH_SALT}
      # 存储（代码只读 STORAGE_TYPE，FILE_UPLOAD_STORAGE_TYPE 是旧变量、无人引用）
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      UPLOAD_BASE_PATH: /data/upload/
      REPORT_STORAGE_PATH: /data/report/
      REVIEW_ATTACH_PATH: /data/review-attach/
      # 邮件
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 阿里云OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
      ALIYUN_OSS_ACCESS_PREFIX: ${ALIYUN_OSS_ACCESS_PREFIX:-}
      # 第三方查重
      THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      # ---- 2C4G JVM 调优 ----
      # 旧应用用的是 -Xmx1536m；这台机器腾掉旧应用后余量约 1.4G，
      # 768m 堆足够且留出构建期余量。上线后用 docker stats 观察再决定是否上调。
      JAVA_OPTS: >-
        -Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dumps
      # 时区
      TZ: Asia/Shanghai
    ports:
      # 只绑回环：宿主机 Nginx / 同网络外的容器通过 127.0.0.1:8080 访问。
      # 同网络内的前端容器可直接用 http://check-backend:8080，不必走宿主端口。
      - "127.0.0.1:8080:8080"
    volumes:
      # 既有数据卷：yml 里 uploads / reports / check-temp / review-attach 的默认路径
      # 全在 /data 下，因此只挂 /data 一处即可看到全部历史文件。
      # 千万不要换成多个独立卷挂到 /data/upload 等子路径，否则既有数据会"消失"。
      - app_data:/data
      # logback 写相对路径 logs/，WORKDIR 为 /app，故落在 /app/logs
      - app_logs:/app/logs
      # 嵌套在 /data 之下：堆转储独立成卷，避免混进业务数据卷
      - dumps:/data/dumps
    mem_limit: 1152m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/check/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app-network

# ========== 卷 ==========
# app_data / app_logs 是服务器上的既有卷，声明为 external 防止本 compose 误创建新卷。
volumes:
  app_data:
    external: true
    name: check-repeat_app_data
  app_logs:
    external: true
    name: check-repeat_app_logs
  dumps:

# ========== 网络 ==========
# 与中间件、前端容器共用同一 bridge 网络，网络别名 mysql/redis/minio/kkfileview 由
# /opt/check-repeat/docker-compose.yml 提供，本 compose 依赖但不再创建。
networks:
  app-network:
    external: true
    name: check-repeat_app-network