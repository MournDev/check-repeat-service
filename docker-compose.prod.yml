# ========================================
# 论文查重管理系统 - 生产环境编排
# 目标机器: 2C4G 阿里云 ECS
#
# 用法:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f backend
#
# 注意:
#   1. 需与本文件同目录存在 .env（含全部密钥与 BACKEND_IMAGE）
#   2. 中间件端口一律绑定 127.0.0.1，不对外暴露，由 Nginx 统一入口
#   3. 每个服务都设了 mem_limit，防止单服务内存失控拖垮整机
# ========================================

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: check-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: check-repeat-service
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # 表结构由 Flyway 管理（classpath:db/migration），不要再挂 init.sql，
    # 否则 schema 会有两个来源，必然不一致
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-allowed-packet=256M
      # ---- 2C4G 内存调优 ----
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=50
      - --table-open-cache=256
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - check-network

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: check-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - check-network

  # ========== MinIO 对象存储 ==========
  minio:
    image: minio/minio:latest
    container_name: check-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GOMEMLIMIT: 256MiB
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - check-network

  # ========== MinIO 初始化（创建 Bucket，执行完即退出）==========
  minio-init:
    image: minio/mc:latest
    container_name: check-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/check-repeat-service;
      mc mb --ignore-existing local/avatar;
      mc mb --ignore-existing local/report-bucket;
      mc mb --ignore-existing local/paper-content;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    mem_limit: 128m
    networks:
      - check-network

  # ========== Spring Boot 后端 ==========
  # 镜像由 Jenkins 在本机构建并打上 BUILD_NUMBER tag，
  # BACKEND_IMAGE 由 deploy.sh 写入 .env
  backend:
    image: ${BACKEND_IMAGE:-check-repeat-service:latest}
    container_name: check-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 服务
      SERVER_PORT: 8080
      # 数据库
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRETKEY: ${MINIO_ROOT_PASSWORD}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 存储
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      UPLOAD_BASE_PATH: /data/upload/
      REPORT_STORAGE_PATH: /data/report/
      REVIEW_ATTACH_PATH: /data/review-attach/
      # 邮件
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 阿里云OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
      ALIYUN_OSS_ACCESS_PREFIX: ${ALIYUN_OSS_ACCESS_PREFIX:-}
      # 第三方查重
      THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      # ---- 2C4G JVM 调优 ----
      JAVA_OPTS: >-
        -Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dumps
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - upload-data:/data/upload
      - report-data:/data/report
      - check-temp:/data/check-temp
      - check-report:/data/check-report
      - review-attach:/data/review-attach
      - app-logs:/app/logs
      - dumps:/data/dumps
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/check/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - check-network

# ========== 持久化卷 ==========
volumes:
  mysql-data:
  redis-data:
  minio-data:
  upload-data:
  report-data:
  check-temp:
  check-report:
  review-attach:
  app-logs:
  dumps:

# ========== 网络 ==========
networks:
  check-network:
    driver: bridge