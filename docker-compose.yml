version: "3.8"

# ========================================
# 论文查重管理系统 - Docker Compose
# ========================================

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: check-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: check-repeat-service
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-allowed-packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - check-network

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: check-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - check-network

  # ========== MinIO 对象存储 ==========
  minio:
    image: minio/minio:latest
    container_name: check-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - check-network

  # MinIO 初始化（创建 Bucket）
  minio-init:
    image: minio/mc:latest
    container_name: check-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/check-repeat-service;
      mc mb --ignore-existing local/avatar;
      mc mb --ignore-existing local/report-bucket;
      mc mb --ignore-existing local/paper-content;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - check-network

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: check-repeat-service-2.0.0
    container_name: check-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 服务
      SERVER_PORT: 8080
      # 数据库
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRETKEY: ${MINIO_ROOT_PASSWORD}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 存储
      STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
      UPLOAD_BASE_PATH: /data/upload/
      REPORT_STORAGE_PATH: /data/report/
      REVIEW_ATTACH_PATH: /data/review-attach/
      # 邮件
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 阿里云OSS
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
      ALIYUN_OSS_ACCESS_PREFIX: ${ALIYUN_OSS_ACCESS_PREFIX:-}
      # 第三方查重
      THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - upload-data:/data/upload
      - report-data:/data/report
      - check-temp:/data/check-temp
      - check-report:/data/check-report
      - review-attach:/data/review-attach
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/check/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - check-network

# ========== 持久化卷 ==========
volumes:
  mysql-data:
  redis-data:
  minio-data:
  upload-data:
  report-data:
  check-temp:
  check-report:
  review-attach:

# ========== 网络 ==========
networks:
  check-network:
    driver: bridge