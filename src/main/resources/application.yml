# 服务基础配置
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /check
  tomcat:
    threads:
      max: 200
      min-spare: 20

# 预览服务
kkfileview:
  base-url: ${KKFILEVIEW_BASE_URL:http://localhost:8080}

# 对象存储
minio:
  # 后端连 MinIO 用（SDK 连接地址）。容器部署下是 compose 网络别名，只有容器内能解析。
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # 拼给浏览器用的地址（如头像的 <img src>）。不配则回退成 endpoint。
  # 生产必须填浏览器可达的地址：http://<公网IP>:9000 或 https://<域名>/minio
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  accesskey: ${MINIO_ACCESSKEY:minioadmin}
  secretkey: ${MINIO_SECRETKEY:minioadmin}
  bucket:
    main: check-repeat-service
    avatar: avatar
    report: report-bucket
    paper_content: paper-content

spring:
  application:
    name: check-repeat-service

  # 数据源配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:check-repeat-service}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2
    username: ${MYSQL_USERNAME:root}
    # 安全修复（P0）：已移除入库的真实密码默认值，本地开发请通过环境变量 MYSQL_PASSWORD 注入
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 180000
      connection-timeout: 30000
      max-lifetime: 1800000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  # Redis 缓存配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 安全修复（P0）：已移除入库的真实 Redis 密码默认值，本地开发请通过环境变量 REDIS_PASSWORD 注入
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 4

  # JWT 配置
  jwt:
    # 安全修复（P0）：默认值仅供本地开发（prod profile 下由 ProductionSecretValidator 拒绝启动）。
    # 生产必须通过环境变量 JWT_SECRET_KEY 注入 ≥32 字符的随机密钥，且上线后不可更换
    secret-key: ${JWT_SECRET_KEY:dev-only-jwt-secret-key-do-not-use-in-prod-0123456789}
    expiration: 86400000
    token-header: Authorization
    # 令牌前缀。此前一直缺这一项，JwtProperties.tokenPrefix 连着是 null，
    # 过滤器和 JwtUtils 各自悄悄回退到默认值 "Bearer" —— 看似能跑，实则约定没有落处。
    # 显式写出来，两端认的才是同一个前缀。
    token-prefix: Bearer

  # 邮件发送配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    # 安全修复（P0）：已移除入库的真实邮箱账号与 SMTP 授权码，通过环境变量注入
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
        debug: false

  # 通知内容模板
  notice:
    email:
      subject-prefix: "[论文查重管理系统] "
      content-header: "尊敬的用户：<br><br>您有一条新的系统通知，请查收：<br><br>"
      content-footer: "<br><br>此邮件为系统自动发送，请勿回复。如需帮助，请联系管理员。<br>论文查重系统团队"

# 查重算法配置
check:
  task:
    max-concurrent: 2
    timeout: 3600000
    temp-file-path: /data/check-temp/
  simhash:
    hash-bits: 64
    k: 3
    hamming-threshold: 3
  text:
    segment:
      type: ik
      dic-path: classpath:dic/
  local:
    enabled: true
    # 引擎比对时是否走检测缓存（DetectionCacheService，缓存库内论文分词+SimHash）
    cache-enabled: true
    # ttl 缓存策略的条目过期时间（小时），策略切换为 ttl 时生效
    cache-expire-hours: 24
  third-party:
    enabled: false
    api-url: https://api.thirdparty.com/check
    api-key: ${THIRD_PARTY_API_KEY:}
    timeout: 30000
  deep-learning:
    enabled: false
    model-path: /models/bert-similarity
    gpu-enabled: false
  # P5 句级标注：命中判定阈值（%）与候选论文数上限
  sentence:
    threshold: 50
    max-candidates: 50
  # P5 导师查重签核门槛：true 时评阅分配前必须存在 qualified=1 的签核记录
  signoff:
    required: true

# 管理端查重规则配置
admin:
  check-rule:
    default-max-count: 5          # 每篇论文最多查重次数
    default-interval: 300         # 两次查重间隔时间（秒）
    default-threshold: 20.00      # 合格阈值（%）
  compare-lib:
    default-enabled: 1
  system-param:
    max-paper-size: 209715200
    max-concurrent-check: 2
  jwt-expiration: 86400000
  # 评阅任务分配（论文全生命周期 P2）
  review-assign:
    avoid-advisor: true           # 评阅人回避规则：指导教师不评阅本人指导的论文（评阅公正性默认约束）
    max-per-teacher: 10           # 单个教师同时进行中的评阅任务上限（自动分配/超时改派的容量控制）
    auto-reassign: true           # 评阅超时后自动改派（false 时仅标记超时，由管理员在分配页手动补派）
    deadline-days: 7              # 未显式指定截止时间/超时改派时的默认评阅期限（天）
  # 答辩管理（论文全生命周期 P3）
  defense:
    # 答辩回避规则：指导教师默认不参与本人学生的评分（评阅公正性默认约束，终期答辩尤为关键）
    avoid-advisor: true
    # 答辩组最少成员数（含组长，1 组长 + N 成员，默认 3 = 1 组长 + 2 成员）
    min-members: 3
    # 答辩通知提前天数：答辩前 N 天给学生发提醒邮件（0=不提前，仅结论通知）
    notify-days-before: 1
  # 导师评价（论文全生命周期 P6a：学生对指导教师的评价，软提醒不卡阶段门）
  advisor-eval:
    # 评价窗口：终期答辩通过后 N 天内可提交评价（存量无状态日志论文不限窗口）
    window-days: 30
    # 催评提前量：窗口剩余 N 天仍未评价时补发一次催评通知（AdvisorEvalRemindScheduler）
    remind-days-before: 3

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.abin.checkrepeatservice.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 监控管理配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    enable:
      jvm: true
      system: true
      process: true
      logback: true
  prometheus:
    metrics:
      export:
        enabled: true

# 响应时间采集配置（供 /api/admin/monitoring/response-time-trend）
monitoring:
  response-time:
    # 分钟桶保留窗口。前端 SystemMonitoring 有 60 分钟选项，故需 >= 60。
    # 内存上限 ≈ window-minutes × max-samples-per-bucket × 8B，调大会线性增长。
    window-minutes: 60
    # 每个分钟桶最多保留的原始耗时样本数（蓄水池采样上限），防止流量尖峰打满堆
    max-samples-per-bucket: 10000
  # 资源指标分钟采样（供 /api/admin/monitoring/performance 的 1h/24h/7d 趋势）
  # 落库到 system_metric_minute，重启后历史保留
  resource-metrics:
    # 数据保留天数，每日 03:40 物理清理更早的数据
    retention-days: 30

# 报告模块配置
report:
  pdf:
    font-path: fonts/simhei.ttf
    page-size: A4
    margin: 50
  preview:
    max-paragraph-length: 500
  storage:
    enabled: true
    base-path: ${REPORT_STORAGE_PATH:/data/report}
    expire-days: 365
  enhanced:
    enabled: true
    include-charts: true
    include-recommendations: true
    template-type: professional

# 教师审核模块配置
review:
  attach:
    base-path: ${REVIEW_ATTACH_PATH:/data/review-attach/}
    max-size: 50MB
    allowed-types: doc,docx,pdf,jpg,png
  batch:
    max-count: 20
  notify:
    enabled: true

# 管理员规则配置模块默认值（已合并到上面的 admin 配置）

# 文件上传配置
file:
  upload:
    storage-type: ${STORAGE_TYPE:LOCAL}
    base-path: ${UPLOAD_BASE_PATH:/data/upload/}
    max-size-mb: 50

# 阿里云OSS配置（可选）
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-prefix: ${ALIYUN_OSS_ACCESS_PREFIX:}

# 论文查重服务配置
paper-check:
  threshold: 20.0
  min-hash-distance: 3
  parse-timeout: 30000
  report-storage-path: ${REPORT_STORAGE_PATH:/data/check-report/}
  compare-library:
    #校内论文库：true
    network-resource: false

# 指导老师分配配置
advisor-assign:
  max-task-count: 10
  retry-count: 3

# 兼容性配置
upload:
  base-path: ${UPLOAD_BASE_PATH:/data/upload/}

# 数据库备份
# 注意：enabled / retention-days 只是"库里取不到时的兜底默认值"，
# 运行时以 system_param 表的 backup_enabled / backup_retention_days 为准
# （由「系统配置」页的备份设置读写），避免两个真相源。
backup:
  dir: ${BACKUP_DIR:/data/backup/}
  enabled: true
  retention-days: 30

# 定时任务开关
# 本应用此前**没有** @EnableScheduling，因此下面这些 @Scheduled 方法虽然写了，
# 却从未执行过。补上注解后它们会立刻生效，其中超时扫描会按库里的历史数据改数据：
# 与其让"上线"成为它们第一次运行，不如默认关闭，确认过输出再逐个打开。
# （AutoBackupScheduler 不在这里，它由 system_param.backup_enabled 控制，
#   也就是「系统配置」页上的那个开关。查重任务清理则由「性能配置」驱动。）
schedule:
  check-task:
    # 把 check_status='checking' 且已超 1 小时的任务标记为失败 —— 会写库
    timeout-scan-enabled: false
    # 旧任务清理已改由「性能配置」页（system_config 表 performance 键的
    # autoCleanup/cleanupInterval）动态驱动：软删除 30 天前的终态任务，
    # 保存即生效，无需此开关。
  data-integrity:
    # 每天 3:00 校验并修复一致性：插入查重结果、改写论文重复率与完成标记 —— 会写库
    enabled: false
  review-assign:
    # 每 10 分钟扫描评阅截止时间已过仍待评阅的任务：标记已超时转派并按
    # admin.review-assign.auto-reassign 自动改派 —— 会写库，默认关闭
    timeout-enabled: false
  advisor-eval:
    # 每天上午9点扫描评价窗口临期（剩 admin.advisor-eval.remind-days-before 天）的
    # 可评未评论文，给学生补发一次催评通知（Redis 去重，整窗口只催一次）—— 会发邮件，默认关闭
    remind-enabled: false
